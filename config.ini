; ============================================================
; Log 設定檔（與 app.py 同層級）
; ============================================================

[LOG]
; log 根資料夾
log_dir = Log
; 每幾天輪轉一個新 log 檔
rotate_days = 7
; 保留幾個舊檔（52 個 × 7 天 ≈ 1 年）
backup_count = 52
; 記錄層級：DEBUG / INFO / WARNING / ERROR
level = INFO

[LOG_FILES]
; 格式：logger名稱 = {功能資料夾名稱}
; 實際 log 檔路徑 = log_dir/{功能資料夾}/{功能}_yyyy_mm_dd.log
; 例如：Log/app/app_2026_08_02.log（檔名為該檔「起始日」，每滿 rotate_days 天換新檔）
; 子模組使用「父名稱.子名稱」命名（如 acc_mail.parse），
; 會自動寫入父層的 log 檔，不需在此列出
; （留言板 message_board 維持原本獨立設定，不納入此處）

; app.py 主體（eRT / eHub / 長官審核 / 物料收貨單 等）
app = app

; 驗收信系統（含 acceptanceWeb/parse.py、MailFunction/acceptanceMail.py）
acc_mail = acc_mail

; 寄信系統（含 MailFunction/normail.py、MailFunction/urgent.py）
mail_send = mail_send

; Flask HTTP 請求記錄（werkzeug），與業務 log 分開
werkzeug = access