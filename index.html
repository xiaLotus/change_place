<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入系統</title>
  <script src="static/js/vue.global.js"></script>
  <link href="static/css/tailwind.min.css" rel="stylesheet" />
  <style>
    body {
      background: radial-gradient(1200px 600px at 10% -10%, #dbeafe 0%, transparent 60%),
                  radial-gradient(900px 500px at 110% 110%, #e0e7ff 0%, transparent 60%),
                  #f1f5f9;
    }
    .card {
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(148,163,184,.25);
      box-shadow: 0 20px 50px -20px rgba(30,41,59,.35), 0 2px 8px rgba(30,41,59,.06);
    }
    .field {
      width: 100%; padding: 11px 14px 11px 42px;
      border: 1px solid #cbd5e1; border-radius: 10px; background: #fff;
      font-size: 15px; transition: border-color .15s, box-shadow .15s;
    }
    .field:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.18); }
    .field-wrap { position: relative; }
    .field-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; pointer-events: none; }

    /* 廠區選擇：分段按鈕 */
    .site-grid { display: grid; grid-auto-flow: column; gap: 8px; }
    .site-btn {
      padding: 10px 0; border-radius: 10px; border: 1px solid #cbd5e1; background: #fff;
      font-weight: 600; color: #475569; cursor: pointer; text-align: center;
      transition: all .15s;
    }
    .site-btn:hover { border-color: #93c5fd; color: #1d4ed8; }
    .site-btn.active { background: #2563eb; border-color: #2563eb; color: #fff; box-shadow: 0 6px 16px -6px rgba(37,99,235,.6); }
    .site-home { font-size: 10px; font-weight: 500; opacity: .75; display: block; margin-top: 1px; }

    #escape-btn {
      position: fixed;
      z-index: 9999;
      transition: left 0.12s cubic-bezier(0.34, 1.56, 0.64, 1),
                  top  0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #tooltip {
      position: fixed;
      background: #1e293b;
      color: #f1f5f9;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 999px;
      pointer-events: none;
      white-space: nowrap;
      z-index: 10000;
      opacity: 0;
      transform: translateY(-4px) translateX(-50%);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    #tooltip.show {
      opacity: 1;
      transform: translateY(-12px) translateX(-50%);
    }
    .fade-enter-active, .fade-leave-active { transition: opacity .2s, transform .2s; }
    .fade-enter-from, .fade-leave-to { opacity: 0; transform: translateY(-4px); }
  </style>
</head>

<body class="h-screen flex items-center justify-center overflow-hidden">

  <div id="app" class="card w-full max-w-sm p-8 rounded-2xl">
    <div class="text-center mb-7">
      <div class="mx-auto w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-200 mb-3">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h2 class="text-2xl font-bold text-slate-800 tracking-wide">請購動態360看板</h2>
      <p class="text-sm text-slate-400 mt-1">請使用公司帳號登入</p>
    </div>

    <div class="space-y-4">
      <div class="field-wrap">
        <span class="field-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <input v-model="username" @keyup.enter="login" type="text" placeholder="工號" class="field" autocomplete="username" />
      </div>
      <div class="field-wrap">
        <span class="field-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
        </span>
        <input v-model="password" @keyup.enter="login" type="password" placeholder="密碼" class="field" autocomplete="current-password" />
      </div>

      <!-- 多廠區：登入者可進入多個廠區時才顯示 -->
      <transition name="fade">
        <div v-if="sites.length > 1">
          <div class="flex items-center justify-between mb-2">
            <span class="text-sm font-medium text-slate-600">選擇要進入的廠區</span>
            <span class="text-xs text-slate-400">共 {{ sites.length }} 個</span>
          </div>
          <div class="site-grid">
            <button v-for="s in sites" :key="s" type="button"
              class="site-btn" :class="{ active: site === s }" @click="site = s">
              {{ s }}
              <span class="site-home">{{ s === sites[0] ? '本廠' : '跨廠查閱' }}</span>
            </button>
          </div>
        </div>
      </transition>

      <!-- 佔位：維持卡片高度不跳動 -->
      <div id="btn-anchor" style="height:44px;"></div>

      <transition name="fade">
        <p v-if="error" class="text-sm text-center rounded-lg px-3 py-2"
           :class="errorIsHint ? 'bg-blue-50 text-blue-700' : 'bg-red-50 text-red-600'">{{ error }}</p>
      </transition>
    </div>
  </div>

  <!-- 逃跑按鈕與提示泡泡 -->
  <button id="escape-btn" class="px-8 py-2.5 rounded-xl font-semibold text-white bg-gray-400 cursor-not-allowed">
    登入
  </button>
  <div id="tooltip"></div>

  <script src="static/js/func/login.js"></script>
</body>
</html>
